name: Android foundation
on:
  push:
    branches: ['main', 'foundation/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK and install required packages
        shell: bash
        run: |
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-verification
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7
